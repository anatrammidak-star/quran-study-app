name: Build Quran Study APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Assets (Database and Icon)
        run: |
          pip install requests pillow
          python generate_db.py
          python generate_icon.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Scaffold Android Project Structure
        run: |
          flutter create . --project-name quran_study --platforms android --org com.kadim.quranlearn

      - name: Inject Internet Permission into AndroidManifest
        run: |
          python -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()
          permissions = '''    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n'''
          if 'android.permission.INTERNET' not in content:
              content = content.replace('<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">', '<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n' + permissions)
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)
          print('AndroidManifest updated successfully with Internet permissions.')
          "

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Compile Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuranStudy-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
